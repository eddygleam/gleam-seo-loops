[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gleam-seo-loops"
version = "0.1.0"
description = "Tested diffing scripts backing Gleam.io's recurring SEO Routines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["gleam_seo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
